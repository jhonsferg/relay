version: 2

updates:
  # Go Dependencies - Core module
  # Only allow minor and patch updates to avoid breaking changes
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "02:00"
    reviewers:
      - "jhonsferg"
    labels:
      - "dependencies"
      - "go"
    # Restrict to minor and patch updates only (no major version bumps)
    # This ensures compatibility with Go 1.25.0+
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # Limit to 5 open PRs to avoid overwhelming maintenance
    groups:
      go-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # GitHub Actions
  # Reduce frequency and limit to manual review (major versions need testing)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"  # Reduced from weekly to monthly
      day: "sunday"
      time: "03:00"
    reviewers:
      - "jhonsferg"
    labels:
      - "ci"
      - "github-actions"
    # Limit to 2 open PRs for GitHub Actions (need careful review)
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  # Extension modules and examples: one grouped PR per week instead of one
  # PR per module and dependency
  - package-ecosystem: "gomod"
    directories:
      - "/ext/breaker/gobreaker"
      - "/ext/brotli"
      - "/ext/cache/lru"
      - "/ext/cache/twolevel"
      - "/ext/chaos"
      - "/ext/compress"
      - "/ext/graphql"
      - "/ext/grpc"
      - "/ext/http3"
      - "/ext/jitterbug"
      - "/ext/memcached"
      - "/ext/metrics"
      - "/ext/mock"
      - "/ext/oauth"
      - "/ext/oidc"
      - "/ext/openapi"
      - "/ext/otel"
      - "/ext/prometheus"
      - "/ext/ratelimit/distributed"
      - "/ext/redis"
      - "/ext/sentry"
      - "/ext/sigv4"
      - "/ext/slog"
      - "/ext/tracing"
      - "/ext/vcr"
      - "/ext/websocket"
      - "/ext/zap"
      - "/examples"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ext"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    groups:
      go-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
