name: TruffleHog Secrets Scanning

# Scans the git history a push or pull request adds (or the whole history
# on the weekly run) and fails on secrets TruffleHog verified as live.
# Unverified matches are left out on purpose: the test suites contain
# example credentials such as https://user:secret@example.com.
#
# Deliberately `pull_request`, never `pull_request_target`: the latter runs
# with a write token and repository secrets, and on its default checkout it
# scans the base branch rather than the pull request anyway.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  trufflehog-scan:
    name: Scan for Secrets & Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog git history scan
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified

      - name: Generate security report
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## TruffleHog Secrets Scan Report"
            echo ""
            if [ "$OUTCOME" = "success" ]; then
              echo "No verified secrets detected."
            else
              echo "**Verified secrets detected.** Remove them from the history and rotate the affected credentials immediately."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
