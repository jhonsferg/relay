name: Benchmark Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  benchmark:
    name: Run benchmarks and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=3 ./... 2>/dev/null | tee bench-results.txt || true
          echo "Benchmark run complete"

      - name: Generate HTML dashboard
        run: |
          python3 scripts/bench_to_html.py bench-results.txt > docs/benchmarks/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/benchmarks
          destination_dir: benchmarks
          keep_files: true
