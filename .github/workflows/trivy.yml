name: Trivy Vulnerability Scanning

# Filesystem scan of every module (go.mod/go.sum under ./ and ext/*),
# the workflows and other configuration, and committed secrets.
#
# - HIGH and CRITICAL findings are reported to Security > Code scanning
#   (category "Trivy-Go") without failing the build.
# - The build fails only on CRITICAL findings: a misconfiguration, or a
#   vulnerability that already has a fixed version.
#
# govulncheck.yml is the blocking gate for Go vulnerabilities: it only
# reports code relay actually reaches, while Trivy also lists vulnerable
# modules that are merely present.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Scan for CVEs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy report (HIGH/CRITICAL, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: Trivy-Go

      - name: Fail on CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true
