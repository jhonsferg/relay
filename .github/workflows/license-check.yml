name: License Compliance Check

# Checks the licenses of every dependency of every module (core, ext/*,
# examples) with google/go-licenses, and fails on forbidden, restricted
# (e.g. GPL, AGPL), or unidentifiable licenses. relay's own modules are
# skipped: they're covered by the repository's LICENSE, which go-licenses
# doesn't look for above each ext/* module directory.

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  pull_request:
    branches: [master]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/license-check.yml'
  push:
    branches: [master]
    paths:
      - '**/go.mod'
      - '**/go.sum'

permissions:
  contents: read

jobs:
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Pin toolchain
        run: go env -w GOTOOLCHAIN=local

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Check licenses in every module
        env:
          GOWORK: "off"
        run: |
          set -u
          failed=0
          {
            echo "## Dependency Licenses"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          : > license-report.csv
          for dir in $(find . -name go.mod -not -path '*/testdata/*' -exec dirname {} \; | sort); do
            echo "::group::$dir"
            if (cd "$dir" && go-licenses check ./... \
                  --disallowed_types=forbidden,restricted,unknown \
                  --ignore github.com/jhonsferg/relay); then
              echo "- \`$dir\`: ok" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$dir\`: **disallowed or unknown license**" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            (cd "$dir" && go-licenses report ./... --ignore github.com/jhonsferg/relay 2>/dev/null) \
              | sed "s|^|$dir,|" >> license-report.csv
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Save license report as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: license-report.csv
          retention-days: 30
