name: Go Vulnerability Check

# govulncheck on every module (core, ext/*, examples) against the Go
# vulnerability database. It fails only when relay's code can actually
# reach the vulnerable function, so it can be a hard gate without noise.
# Replaces the Nancy scan, whose Sonatype OSS Index now requires
# authentication and had silently stopped reporting anything.
# Runs daily too: new advisories appear for unchanged dependencies.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Pin toolchain
        run: go env -w GOTOOLCHAIN=local

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan every module
        env:
          GOWORK: "off"
        run: |
          set -u
          failed=0
          echo "## govulncheck" >> "$GITHUB_STEP_SUMMARY"
          for dir in $(find . -name go.mod -not -path '*/testdata/*' -exec dirname {} \; | sort); do
            echo "::group::$dir"
            if (cd "$dir" && govulncheck ./...); then
              echo "- \`$dir\`: no reachable vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$dir\`: **reachable vulnerabilities (see log)**" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
