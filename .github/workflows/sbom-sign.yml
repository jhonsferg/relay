name: Generate SBOM and Sign Releases

# For each release: an SBOM of every module in the repository (SPDX and
# CycloneDX), each signed keyless with Sigstore using this workflow's
# GitHub OIDC identity, attached to the GitHub release.
#
# Runs on a published release, or on demand for a tag. Releases created by
# auto-version-release.yml use GITHUB_TOKEN, whose events don't trigger
# other workflows, so that workflow dispatches this one explicitly.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to generate and sign the SBOM for (e.g. v0.5.1)
        required: true

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate and sign SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOMs to the release
      id-token: write # Sigstore keyless signing
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: relay-${{ env.TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: relay-${{ env.TAG }}.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the SBOMs
        run: |
          for f in "relay-$TAG.spdx.json" "relay-$TAG.cyclonedx.json"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            "relay-$TAG.spdx.json" "relay-$TAG.spdx.json.sigstore.json" \
            "relay-$TAG.cyclonedx.json" "relay-$TAG.cyclonedx.json.sigstore.json"

      - name: Summary
        run: |
          {
            echo "## SBOM for $TAG"
            echo ""
            echo "Attached to the release: SPDX and CycloneDX SBOMs, each with a Sigstore bundle."
            echo ""
            echo '```sh'
            echo "cosign verify-blob relay-$TAG.spdx.json \\"
            echo "  --bundle relay-$TAG.spdx.json.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/sbom-sign\.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
